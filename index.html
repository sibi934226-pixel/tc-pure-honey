
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThenChittu Natural Honey</title>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script type="text/javascript">
    (function(){ emailjs.init("6543ToAjP-Op9UaYP"); })();
  </script>
  <style>
    body { font-family: sans-serif; background-color: #fffdf5; margin: 0; padding: 0; }
    header { background-color: #fca311; padding: 15px; text-align: center; color: white; }
    .nav { margin-top: 10px; }
    .nav a { color: white; text-decoration: none; margin: 0 10px; font-weight: bold; }
    .container { padding: 20px; }
    input, select, textarea { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; background-color: #eef4fc; }
    .btn-gps { width: 100%; background-color: #007bff; color: white; padding: 15px; border: none; border-radius: 8px; font-weight: bold; }
    .status { margin: 10px 0; color: green; font-weight: bold; text-align: center; }
    .msg-box { border: 2px solid #28a745; background-color: #e6f4ea; padding: 20px; border-radius: 10px; text-align: center; display: none; }
    .msg-box h3 { color: #28a745; margin: 0; }
  </style>
</head>
<body>

  <header>
    <h2>🍯 ThenChittu Natural Honey</h2>
    <div class="nav">
      <a href="#">Home</a> <a href="#">Products</a> <a href="#">Order</a> <a href="#">Contact</a>
    </div>
  </header>

  <div class="container">
    <form id="orderForm">
      <input type="text" id="name" placeholder="Your Name" required>
      <input type="tel" id="phone" placeholder="Phone Number" required>
      
      <select id="product">
        <option>ThenChittu Natural Honey 250ml - ₹300</option>
        <option>ThenChittu Natural Honey 500ml - ₹600</option>
      </select>
      
      <input type="number" id="quantity" placeholder="1" value="1">
      <textarea id="address" placeholder="Address" rows="4"></textarea>
      
      <button type="button" class="btn-gps" onclick="getLocation()">📍 Use My Current Location (GPS)</button>
      <p id="locStatus" class="status"></p>
      
      <button type="submit" class="btn-gps" style="background-color: #28a745; margin-top: 10px;">Submit Order</button>
    </form>

    <div id="successMsg" class="msg-box" style="margin-top: 20px;">
      <h3>✅ Order Placed Successfully!</h3>
      <p>நன்றி! உங்கள் ஆர்டர் பெறப்பட்டது. விரைவில் உங்களை தொடர்பு கொள்கிறோம்.</p>
    </div>
  </div>

  <script>
    function getLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(() => {
          document.getElementById('locStatus').innerText = '📍 Location captured! ✅';
        });
      }
    }

    document.getElementById('orderForm').addEventListener('submit', function(e) {
      e.preventDefault();
      emailjs.send('service_rwfxqy9', 'template_bowksvf', {
        user_name: document.getElementById('name').value,
        user_phone: document.getElementById('phone').value,
        user_product: document.getElementById('product').value,
        user_quantity: document.getElementById('quantity').value,
        user_address: document.getElementById('address').value
      }).then(() => {
        document.getElementById('orderForm').style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
      });
    });
  </script>
</body>
</html>
